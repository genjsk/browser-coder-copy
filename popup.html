<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网页代码复制助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="topbar">
    <img class="logo" src="icons/icon48.png" alt="">
    <div class="titles">
      <h1>网页代码复制助手</h1>
      <p id="pageInfo" class="page-info">正在读取当前标签页…</p>
    </div>
    <span id="statusDot" class="status-dot" title="状态"></span>
  </header>

  <div id="consentBanner" class="consent hidden">
    <p>使用“强制读取”需要一次性授权。浏览器会暂时显示正在调试的提示。</p>
    <button id="consentBtn" class="btn primary block">同意并启用调试权限</button>
  </div>

  <main>
    <section class="card">
      <div class="card-head">
        <h2>代码取出</h2>
        <span id="editorBadge" class="badge">未检测</span>
      </div>
      <div id="pickRow" class="row pick-row hidden">
        <label class="hint" for="editorPick">代码来源</label>
        <select id="editorPick" class="picker"></select>
      </div>
      <div class="row">
        <button id="readBtn" class="btn">读取代码</button>
        <button id="copyBtn" class="btn primary" disabled>复制到剪贴板</button>
      </div>
      <div class="row">
        <button id="readSelectionBtn" class="btn tiny">读取选中文字</button>
        <button id="forceReadBtn" class="btn tiny">强制读取（Ctrl+A/C）</button>
      </div>
      <textarea id="codeView" class="editor-view" spellcheck="false" readonly placeholder="这里显示网页编辑器、代码块或选中的文字"></textarea>
      <p id="readMeta" class="meta"></p>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>页面解锁</h2>
        <label class="switch">
          <input id="unlockToggle" type="checkbox" checked>
          <span></span>
        </label>
      </div>
      <p class="meta">关闭“禁止复制、禁止右键、user-select:none”等前端限制，保存后刷新页面生效。</p>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>诊断</h2>
        <button id="diagBtn" class="btn tiny">检查当前页</button>
        <button id="diagCopyBtn" class="btn tiny">复制诊断</button>
      </div>
      <pre id="diagResult" class="output hidden"></pre>
    </section>
  </main>

  <footer class="footer">
    <span>页面有多个代码区时，可以从「代码来源」下拉框选择。</span>
  </footer>

  <script src="popup.js" type="module"></script>
</body>
</html>
